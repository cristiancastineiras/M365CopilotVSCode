{{ define "main" }}
<div class="nf">

  <div class="wrap narrow center nf-body">
    <div class="nf-sprites" aria-hidden="true">
      <img class="sprite" src="{{ "pixel/m365.svg" | relURL }}" width="96" height="96" alt="">
      <img class="sprite" src="{{ "pixel/vscode.svg" | relURL }}" width="96" height="96" alt="">
    </div>
    <p class="eyebrow">404</p>
    <h1>{{ i18n "nf_title" }}</h1>
    <p class="lead">{{ i18n "nf_text" }}</p>
    <p><a class="btn btn-primary" href="{{ site.Home.RelPermalink }}">{{ i18n "btn_back_home" }}</a></p>
  </div>
</div>
{{ end }}
