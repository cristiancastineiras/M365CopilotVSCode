# Sitio de M365 Copilot for VS Code (Hugo, sin tema externo: todo está en layouts/ y assets/).
# En local:  hugo server        En CI: .github/workflows/pages.yml pasa --baseURL de Pages.
baseURL = "https://cristiancastineiras.github.io/M365CopilotVSCode/"
title = "M365 Copilot for VS Code"

# Inglés en la raíz, español en /es/. Sin redirección automática por idioma: es mala para SEO.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
# Fecha real de cada página (el último commit que la tocó) en el sitemap y en los datos estructurados.
# En CI hace falta el historial completo: pages.yml hace checkout con fetch-depth: 0.
enableGitInfo = true
disableKinds = ["RSS", "taxonomy", "term"]

[languages.en]
  label = "English"
  locale = "en"
  weight = 1

[languages.es]
  label = "Español"
  locale = "es"
  weight = 2

[params]
  repo = "cristiancastineiras/M365CopilotVSCode"
  marketplaceId = "m365-copilot-vscode.m365-copilot-vscode"
  chromeStore = "https://chromewebstore.google.com/detail/cdeegiifkgahagfcjhedkdcfbpipffdd"
  firefoxStore = "https://addons.mozilla.org/firefox/addon/microsoft-365-copilot-vs-code/"
  # Para las cifras de usuarios de cada tienda (ver stats.html).
  chromeStoreId = "cdeegiifkgahagfcjhedkdcfbpipffdd"
  firefoxSlug = "microsoft-365-copilot-vs-code"
  defaultLang = "en"
  # Analítica sin cookies (https://<nombre>.goatcounter.com). Vacío = sin analítica.
  goatcounter = "m365copilotvscode"
  # Verificación de propiedad en buscadores (opcionales): el valor del meta que dan Search Console / Bing.
  googleVerification = ""
  bingVerification = ""

# llms.txt (https://llmstxt.org): resumen en Markdown para asistentes de IA, generado desde la portada
# (layouts/home.llms.txt). /llms.txt en inglés y /es/llms.txt en español.
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "llms"]

[markup.goldmark.renderer]
  unsafe = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

[minify]
  minifyOutput = true

[sitemap]
  changefreq = "monthly"
  priority = 0.7

[imaging.webp]
  quality = 82
