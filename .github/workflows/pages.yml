name: Pages

# Compila la web (extensiones/web, Hugo) y la publica en GitHub Pages cuando cambia algo de ella en
# `main`. En PRs sólo comprueba que compila. Los enlaces de descarga no necesitan republicar la web:
# apuntan a releases/latest y su JavaScript pide la versión actual a la API de GitHub.
#
# Una sola vez, en el repositorio: Settings → Pages → Build and deployment → Source: «GitHub Actions».
on:
  push:
    branches:
      - main
    paths:
      - "extensiones/web/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "extensiones/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue a la vez; uno en curso se termina en vez de cancelarse a medias.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Hugo «extended»: hace falta para convertir las capturas a WebP.
  HUGO_VERSION: 0.168.0

jobs:
  build:
    name: Compilar la web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Historial completo: enableGitInfo pone en el sitemap y en los datos estructurados la fecha del
          # último commit de cada página, y con un clon superficial todas tendrían la del último.
          fetch-depth: 0

      - name: Instalar Hugo
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          file="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${file}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          sudo tar -xzf "${file}" -C /usr/local/bin hugo
          hugo version

      # Da la URL real de Pages (con el subpath del repositorio o el dominio propio). Los PRs no
      # despliegan, así que no la piden: Pages puede no estar activado en un fork.
      - name: Configurar Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Compilar
        working-directory: extensiones/web
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          args=(--gc --minify --destination "${GITHUB_WORKSPACE}/_site")
          if [ -n "${BASE_URL}" ]; then args+=(--baseURL "${BASE_URL}/"); fi
          hugo "${args[@]}"

      - name: Subir el artefacto
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Desplegar en GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5

      # IndexNow (https://www.indexnow.org): avisa a Bing (y por él a Copilot y a otros buscadores que lo
      # comparten) de qué páginas hay, para que las reindexe en minutos y no en semanas. La clave no es
      # secreta: es el archivo static/<clave>.txt de la web, que prueba que el aviso viene del dueño. Que
      # falle no tumba el despliegue.
      - name: Avisar a los buscadores (IndexNow)
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          INDEXNOW_KEY: 7ffb6c4203e1f167c6316aa9ab61e7e2
        run: |
          base="${PAGE_URL%/}"
          host="${base#https://}"
          host="${host%%/*}"
          # El sitemap raíz es un índice con uno por idioma.
          urls=$(curl -fsS "${base}/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' \
            | xargs -r -n1 curl -fsS | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | sort -u)
          if [ -z "$urls" ]; then echo "Sin URLs en el sitemap"; exit 0; fi
          printf '%s\n%s\n%s\n' "$urls" "${base}/llms.txt" "${base}/es/llms.txt" > urls.txt
          cat urls.txt
          jq -n --arg host "$host" --arg key "$INDEXNOW_KEY" --arg loc "${base}/${INDEXNOW_KEY}.txt" \
            --rawfile urls urls.txt \
            '{host: $host, key: $key, keyLocation: $loc, urlList: ($urls | split("\n") | map(select(length > 0)))}' \
            > body.json
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" --data @body.json \
            -w "IndexNow: HTTP %{http_code}\n"
