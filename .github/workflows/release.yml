name: Release

# Se dispara al hacer `git push` de un tag `vX.Y.Z` (p. ej. `v1.0.0`). Compila
# y empaqueta las dos extensiones (VS Code + navegador) y el paquete
# compartido, y publica UNA release de GitHub con el changelog de cada uno y
# estos artefactos:
#   releases/vscode/m365-copilot-vscode-X.Y.Z.vsix
#   releases/chrome/m365-copilot-vscode-extension-chrome.zip
#   releases/edge/m365-copilot-vscode-extension-edge.zip
#   releases/firefox/m365-copilot-vscode-extension-firefox.zip
#   releases/tampermonkey/m365copilot-token.user.js
# La carpeta releases/ sólo existe aquí, en el runner: está en .gitignore y
# no se versiona; la release de GitHub es el único sitio donde se publican.
# Después publica el .vsix en el VS Code Marketplace y sube la extensión de
# navegador a Chrome Web Store y a Firefox Add-ons (AMO), cada una aunque otra
# falle y las dos últimas sólo si tienen sus secrets (ver más abajo).
#
# Flujo para sacar una versión nueva:
#   1. pnpm changeset            # describe el cambio (interactivo)
#   2. pnpm version-packages     # sube versión + CHANGELOG.md de los 3 paquetes
#   3. git add -A && git commit -m "chore: release vX.Y.Z"
#   4. git tag vX.Y.Z && git push --follow-tags
# Los tres paquetes están en un grupo "fixed" de changesets: siempre suben de
# versión juntos, así que un único tag sirve para los tres a la vez.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  # Token OIDC de GitHub para publicar en el VS Code Marketplace sin secreto.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # VS Code Marketplace, sin secrets: Trusted Publishing. El publisher
    # `m365-copilot-vscode` tiene en marketplace.visualstudio.com/manage una
    # política que confía en este repositorio, este archivo y este entorno, y
    # los tres tienen que coincidir con ella: si cambia alguno, hay que
    # actualizarla. Sin PAT: los globales de Azure DevOps se retiran el 1-12-2026.
    environment: marketplace
    # Credenciales de las demás tiendas, como secrets del repositorio:
    #   Firefox Add-ons: AMO_JWT_ISSUER / AMO_JWT_SECRET (addons.mozilla.org →
    #     Developer Hub → Manage API Keys).
    #   Chrome Web Store (API v2; la v1.1 se apagó el 15-10-2026):
    #     CWS_PUBLISHER_ID (Developer Dashboard → Account) y la cuenta de
    #     servicio de Google Cloud con acceso a ese publisher:
    #     CWS_SERVICE_ACCOUNT_EMAIL / CWS_SERVICE_ACCOUNT_PRIVATE_KEY (el
    #     `private_key` del JSON, con «\n» literales o con saltos reales).
    # Sin los de una tienda, la release sale igual y esa tienda no se toca.
    # Aquí sólo va si existen (`secrets` no se puede usar en el `if:` de un
    # step); las claves en sí sólo las ve el step que publica, no los
    # postinstall de `pnpm install`.
    env:
      HAS_AMO_KEYS: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
      HAS_CWS_KEYS: ${{ secrets.CWS_PUBLISHER_ID != '' && secrets.CWS_SERVICE_ACCOUNT_EMAIL != '' && secrets.CWS_SERVICE_ACCOUNT_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Habilitar Corepack (pnpm)
        run: corepack enable

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar que el tag coincide con las versiones
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const expected = process.env.RELEASE_TAG.replace(/^v/, "");
            const packages = [
              "extensiones/vscode/package.json",
              "extensiones/browser/package.json",
              "packages/core/package.json",
            ];
            for (const path of packages) {
              const { name, version } = JSON.parse(readFileSync(path, "utf8"));
              if (version !== expected) {
                console.error(`${path} (${name}) is ${version}; tag requires ${expected}`);
                process.exitCode = 1;
              }
            }
          '

      - name: Compilar y empaquetar todo (core + VS Code + navegador + userscript)
        run: pnpm package

      - name: Generar notas de la versión
        run: node scripts/release-notes.mjs "${{ github.ref_name }}" > release-notes.md

      - name: Versión a publicar (tag sin la «v»)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publicar release en GitHub
        id: gh-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            releases/vscode/m365-copilot-vscode-${{ env.VERSION }}.vsix
            releases/chrome/m365-copilot-vscode-extension-chrome.zip
            releases/edge/m365-copilot-vscode-extension-edge.zip
            releases/firefox/m365-copilot-vscode-extension-firefox.zip
            releases/tampermonkey/m365copilot-token.user.js

      # Cada tienda corre si la release de GitHub salió, aunque otra tienda
      # falle (`!cancelled()`): un fallo en una no deja a las demás sin versión.
      # El mismo .vsix de la release. --skip-duplicate: relanzar el job no
      # falla por una versión que ya está publicada.
      - name: Publicar en VS Code Marketplace
        if: ${{ !cancelled() && steps.gh-release.outcome == 'success' }}
        working-directory: extensiones/vscode
        run: pnpm exec vsce publish --oidc --skip-duplicate --packagePath "../../releases/vscode/m365-copilot-vscode-${VERSION}.vsix"

      # `wxt submit` (publish-browser-extension, viene con WXT) sube cada zip y
      # lo manda a revisión; la tienda publica la versión cuando la aprueba.
      # Una tienda sin zip se salta. AMO recibe también el zip de fuentes
      # porque el código va minificado, y firma la versión él mismo: no hay
      # .xpi propio (AMO no admite el mismo número de versión en dos canales).
      # Edge no tiene tienda aquí: se instala desde la Chrome Web Store o con
      # el .zip de la release.
      - name: Publicar en Chrome Web Store y Firefox Add-ons
        if: ${{ !cancelled() && steps.gh-release.outcome == 'success' && (env.HAS_CWS_KEYS == 'true' || env.HAS_AMO_KEYS == 'true') }}
        working-directory: extensiones/browser
        env:
          CHROME_ZIP: ${{ env.HAS_CWS_KEYS == 'true' && '../../releases/chrome/m365-copilot-vscode-extension-chrome.zip' || '' }}
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: cdeegiifkgahagfcjhedkdcfbpipffdd
          CHROME_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CWS_SERVICE_ACCOUNT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_ZIP: ${{ env.HAS_AMO_KEYS == 'true' && '../../releases/firefox/m365-copilot-vscode-extension-firefox.zip' || '' }}
          FIREFOX_SOURCES_ZIP: ../../releases/firefox/m365-copilot-vscode-extension-${{ env.VERSION }}-sources.zip
          # ID numérico de AMO del complemento (FIREFOX_ADDON_ID en
          # wxt.config.base.ts). No el GUID: wxt submit le quita las llaves y
          # AMO sólo encuentra un GUID de tipo UUID con ellas (404).
          FIREFOX_EXTENSION_ID: "3113010"
          FIREFOX_CHANNEL: listed
          FIREFOX_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # La clave de la cuenta de servicio se acepta tal cual sale del JSON de
        # Google (con «\n» literales): el PEM necesita saltos de línea reales.
        run: |
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY="$(printf '%s' "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" | sed 's/\\n/\n/g')" \
            pnpm exec wxt submit
