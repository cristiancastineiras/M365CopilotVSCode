name: Release

# Se dispara al hacer `git push` de un tag `vX.Y.Z` (p. ej. `v1.0.0`). Compila
# y empaqueta las dos extensiones (VS Code + navegador) y el paquete
# compartido, y publica UNA release de GitHub con los tres artefactos y el
# changelog de cada uno.
#
# Flujo para sacar una versión nueva:
#   1. pnpm changeset            # describe el cambio (interactivo)
#   2. pnpm version-packages     # sube versión + CHANGELOG.md de los 3 paquetes
#   3. git add -A && git commit -m "chore: release vX.Y.Z"
#   4. git tag vX.Y.Z && git push --follow-tags
# Los tres paquetes están en un grupo "fixed" de changesets: siempre suben de
# versión juntos, así que un único tag sirve para los tres a la vez.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Credenciales de la API de AMO (addons.mozilla.org → Developer Hub → Manage
    # API Keys) guardadas como secrets AMO_JWT_ISSUER / AMO_JWT_SECRET. Si no
    # están, la release sale igual, sin el .xpi firmado. Aquí sólo va si
    # existen (`secrets` no se puede usar en el `if:` de un step); las claves
    # en sí sólo las ve el step que firma, no los postinstall de `pnpm install`.
    env:
      HAS_AMO_KEYS: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Habilitar Corepack (pnpm)
        run: corepack enable

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar y empaquetar todo (core + VS Code + navegador)
        run: pnpm package

      - name: Generar notas de la versión
        run: node scripts/release-notes.mjs "${{ github.ref_name }}" > release-notes.md

      - name: Versión a publicar (tag sin la «v»)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publicar release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            releases/m365-copilot-vscode-${{ env.VERSION }}.vsix
            releases/chrome/m365-copilot-vscode-extension-chrome.zip
            releases/firefox/m365-copilot-vscode-extension-firefox.zip

      # Firefox Release sólo instala de forma permanente complementos firmados
      # por Mozilla: sin firma, el .zip sólo sirve como complemento temporal.
      # Canal «unlisted»: AMO lo firma pero no lo publica en la tienda.
      - name: Firmar la extensión de Firefox en AMO
        if: env.HAS_AMO_KEYS == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: pnpm --filter m365-copilot-vscode-extension sign:firefox

      - name: Añadir el .xpi firmado a la release
        if: env.HAS_AMO_KEYS == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: releases/firefox/m365-copilot-vscode-extension-firefox.xpi
