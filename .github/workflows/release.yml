name: Release

# Se dispara al hacer `git push` de un tag `vX.Y.Z` (p. ej. `v1.0.0`). Compila
# y empaqueta las dos extensiones (VS Code + navegador) y el paquete
# compartido, y publica UNA release de GitHub con el changelog de cada uno y
# estos artefactos:
#   releases/vscode/m365-copilot-vscode-X.Y.Z.vsix
#   releases/chrome/m365-copilot-vscode-extension-chrome.zip
#   releases/edge/m365-copilot-vscode-extension-edge.zip
#   releases/firefox/m365-copilot-vscode-extension-firefox.zip (+ .xpi firmado)
#   releases/tampermonkey/m365copilot-token.user.js
# La carpeta releases/ sólo existe aquí, en el runner: está en .gitignore y
# no se versiona; la release de GitHub es el único sitio donde se publican.
#
# Flujo para sacar una versión nueva:
#   1. pnpm changeset            # describe el cambio (interactivo)
#   2. pnpm version-packages     # sube versión + CHANGELOG.md de los 3 paquetes
#   3. git add -A && git commit -m "chore: release vX.Y.Z"
#   4. git tag vX.Y.Z && git push --follow-tags
# Los tres paquetes están en un grupo "fixed" de changesets: siempre suben de
# versión juntos, así que un único tag sirve para los tres a la vez.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Credenciales de la API de AMO (addons.mozilla.org → Developer Hub → Manage
    # API Keys) guardadas como secrets AMO_JWT_ISSUER / AMO_JWT_SECRET. Si no
    # están, la release sale igual, sin el .xpi firmado. Aquí sólo va si
    # existen (`secrets` no se puede usar en el `if:` de un step); las claves
    # en sí sólo las ve el step que firma, no los postinstall de `pnpm install`.
    env:
      HAS_AMO_KEYS: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Habilitar Corepack (pnpm)
        run: corepack enable

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar que el tag coincide con las versiones
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const expected = process.env.RELEASE_TAG.replace(/^v/, "");
            const packages = [
              "extensiones/vscode/package.json",
              "extensiones/browser/package.json",
              "packages/core/package.json",
            ];
            for (const path of packages) {
              const { name, version } = JSON.parse(readFileSync(path, "utf8"));
              if (version !== expected) {
                console.error(`${path} (${name}) is ${version}; tag requires ${expected}`);
                process.exitCode = 1;
              }
            }
          '

      - name: Compilar y empaquetar todo (core + VS Code + navegador + userscript)
        run: pnpm package

      - name: Generar notas de la versión
        run: node scripts/release-notes.mjs "${{ github.ref_name }}" > release-notes.md

      - name: Versión a publicar (tag sin la «v»)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publicar release en GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            releases/vscode/m365-copilot-vscode-${{ env.VERSION }}.vsix
            releases/chrome/m365-copilot-vscode-extension-chrome.zip
            releases/edge/m365-copilot-vscode-extension-edge.zip
            releases/firefox/m365-copilot-vscode-extension-firefox.zip
            releases/tampermonkey/m365copilot-token.user.js

      # Firefox Release sólo instala de forma permanente complementos firmados
      # por Mozilla: sin firma, el .zip sólo sirve como complemento temporal.
      # Canal «unlisted»: AMO lo firma pero no lo publica en la tienda.
      - name: Firmar la extensión de Firefox en AMO
        if: env.HAS_AMO_KEYS == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: pnpm --filter m365-copilot-vscode-extension sign:firefox

      - name: Añadir el .xpi firmado a la release
        if: env.HAS_AMO_KEYS == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: releases/firefox/m365-copilot-vscode-extension-firefox.xpi

      # VSCE_PAT es un PAT de Azure DevOps con acceso a publicar extensiones.
      # Sin él, la release de GitHub se publica normalmente y este paso se omite.
      - name: Publicar extensión de VS Code en VS Marketplace
        if: env.HAS_VSCE_PAT == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm --filter m365-copilot-vscode exec vsce publish --packagePath "$GITHUB_WORKSPACE/releases/vscode/m365-copilot-vscode-${VERSION}.vsix" --pat "$VSCE_PAT"
